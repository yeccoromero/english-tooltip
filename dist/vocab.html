<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Mi vocabulario</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.4 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; }
  nav { display: flex; gap: 6px; margin-bottom: 14px; }
  nav button { padding: 6px 14px; border-radius: 8px; border: 1px solid #9ca3af66; background: transparent; color: inherit; cursor: pointer; }
  nav button.on { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; border-bottom: 1px solid #9ca3af44; display: flex; gap: 8px; }
  li div { flex: 1; overflow-wrap: anywhere; }
  .en { font-weight: 600; } .es { color: #6b7280; } .empty { color: #6b7280; padding: 12px 0; }
  button { cursor: pointer; }
  .tools { display: flex; gap: 6px; margin-top: 12px; }
  .stats { color: #6b7280; margin-bottom: 10px; }
  .card { border: 1px solid #9ca3af66; border-radius: 14px; padding: 28px 18px; text-align: center; min-height: 140px;
          display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .card .front { font-size: 24px; font-weight: 700; overflow-wrap: anywhere; }
  .card .back { font-size: 20px; color: #4f46e5; }
  @media (prefers-color-scheme: dark) { .card .back { color: #a5b4fc; } }
  .card .src { font-size: 12px; color: #6b7280; }
  .card .def { font-size: 14px; color: #6b7280; white-space: pre-wrap; }
  .card .ctx { font-size: 14px; font-style: italic; }
  .card .ctx mark { background: #fde68a66; color: inherit; border-radius: 3px; padding: 0 2px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { font-size: 13px; padding: 3px 10px; border-radius: 99px; border: 1px solid #9ca3af66; }
  li .ctx { font-size: 12px; color: #6b7280; font-style: italic; }
  .actions { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .actions button { padding: 8px 18px; border-radius: 8px; border: 1px solid #9ca3af66; font-size: 14px; }
  .good { background: #16a34a; color: #fff; border-color: #16a34a !important; }
  .again { background: #dc2626; color: #fff; border-color: #dc2626 !important; }
  [hidden] { display: none !important; }
</style></head><body>
<header><h1>Mi vocabulario</h1><a href="#" id="opts">Opciones</a></header>
<nav><button id="tabReview" class="on">Repasar</button><button id="tabList">Lista</button></nav>

<section id="review">
  <div class="chips"><span class="chip" id="streak"></span><span class="chip" id="today"></span><span class="chip" id="stats"></span></div>
  <div class="card" id="card" hidden>
    <div class="front" id="front"></div>
    <div class="back" id="back" hidden></div>
    <div class="def" id="def" hidden></div>
    <div class="ctx" id="ctx" hidden></div>
    <div class="src" id="src"></div>
  </div>
  <div class="empty" id="done" hidden></div>
  <div class="actions" id="actShow" hidden><button id="speak">🔊</button><button id="show">Mostrar traducción</button></div>
  <div class="actions" id="actGrade" hidden><button class="again" id="again">Otra vez</button><button class="good" id="good">Lo sabía</button></div>
</section>

<section id="list" hidden>
  <ul id="ul"></ul>
  <div class="tools"><button id="csv">Exportar CSV (Anki)</button><button id="clear">Borrar todo</button></div>
</section>
<script src="vocab.js"></script>
</body></html>
