<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Vocabulario</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 0; padding: 10px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  h1 { font-size: 15px; margin: 0; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow: auto; }
  li { padding: 6px 0; border-bottom: 1px solid #9ca3af44; display: flex; gap: 6px; }
  li div { flex: 1; overflow-wrap: anywhere; }
  .en { font-weight: 600; } .es { color: #6b7280; }
  button { cursor: pointer; }
  .empty { color: #6b7280; padding: 12px 0; }
  .tools { display: flex; gap: 6px; margin-top: 8px; }
</style></head><body>
<header><h1>Mi vocabulario</h1><a href="#" id="opts">Opciones</a></header>
<ul id="list"></ul>
<div class="tools"><button id="csv">Exportar CSV (Anki)</button><button id="clear">Borrar todo</button></div>
<script src="popup.js"></script>
</body></html>
